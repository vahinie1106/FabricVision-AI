input_dir: data/raw
output_dir: data/processed
target_size: [512, 512]
supported_formats:
  - .jpg
  - .jpeg
  - .png
min_width: 16
min_height: 16
min_resolution: 256
blur_threshold: 100.0
enable_background_processing: true
background_strategy: none
enable_noise_reduction: false
noise_reduction_type: null
enable_augmentation: false
augmentation_config:
  horizontal_flip: 0.5
  rotation: 10
  brightness: 0.1
  contrast: 0.1
  zoom: 0.05
normalize: true
