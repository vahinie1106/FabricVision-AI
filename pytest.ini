[pytest]
testpaths = tests
norecursedirs = models venv .git .gradio
markers =
    slow: real end-to-end test that loads actual model weights and can take
        10+ minutes on the RTX 3050 (e.g. a full FLUX.1-Kontext generation
        through the live FastAPI app). Excluded from the default run.
        Run explicitly with: pytest -m slow
addopts = -m "not slow"
